- title: Research programmes
  projects:
    - name: ORICA
      context: Junior professorship programme · INRAE
      description: Mapping changing environments, navigating deformable ground and vegetation, and manipulating plants. ORICA brings these questions together within R-LEAF.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projet-nationaux/orica
    - name: NINSAR
      context: PEPR Agroécologie et Numérique · 2023–2027
      description: Cooperative robot fleets for new agroecological cropping practices. TSCF contributes to a consortium linking robot behaviour, field operations and environmental feedback.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projet-nationaux/agroecologie-et-numerique-ninsar
    - name: MUSCAA
      context: ANR · started December 2023
      description: Anticipating changes in terrain interaction to adapt robot behaviour. Coordinated by TSCF, the project combines perception, learning and supervision of control modes.
      url: https://anr.fr/Project-ANR-23-CE33-0015
    - name: STAIRS
      context: Grand Défi Robotique Agricole · launched 2025
      description: Shared methods for robot interoperability, environmental assessment and software development. TSCF coordinates the project with RobAgri.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projet-nationaux/stairs
    - name: CapaRob
      context: CIR ITPS · CAP 20-25
      description: Designing the supervision of agricultural robot fleets with the people who use them. The collaboration between ACTé and TSCF studies work organisation, operator control and simulated operating situations.
      url: https://cap2025.fr/medias/fichier/cir-itps-caparob-doct-ergonomie-offre-2024_1719301721527-pdf?ID_FICHE=1070639&INLINE=FALSE
    - name: ManiVol
      context: I-SITE CAP 20-25 · TSCF and SIGMA Clermont
      description: Aerial manipulation for placing, moving and retrieving connected sensors in agricultural environments, using feedback from the objects themselves.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projets-regionaux/manivol

- title: Joint laboratories
  projects:
    - name: AgriVia
      context: ANR LabCom · TSCF and INNODURA TB
      description: Reliable multimodal perception for autonomous navigation in natural environments, accounting for people, crops and deformable vegetation.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projet-nationaux/labcom-agrivia
    - name: TIARA
      context: ANR LabCom · TSCF and SABI AGRI
      description: Adaptive control and decision making for electric agricultural vehicles, with robot behaviour selected according to the task and operating conditions.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projet-nationaux/labcom-tiara
    - name: i-SMART
      context: Associated partnership laboratory · TSCF and Sherpa Engineering
      description: Methods and engineering tools for agricultural robotics and off-road mobility, developed through the AgroTechnoPôle partnership.
      url: https://www.sherpa-eng.com/lpa-i-smart-le-nouveau-laboratoire-partenarial-associe-pour-la-plateforme-agrotechnopole/
    - name: TREASUR
      context: International associated laboratory · INRAE and NARO, Japan
      description: Research on adaptive robot behaviour, navigation safety, implement control and energy use. The cooperation between TSCF and NARO was launched in 2024.
      url: https://www.inrae.fr/sites/default/files/ra_web-vf_0.pdf

- title: European projects
  projects:
    - name: AIGreenBots
      context: Marie Skłodowska-Curie doctoral network
      description: Doctoral training in robotics and sensor fusion for precision agriculture. TSCF studies how local robot measurements and wider environmental data can support adaptation to terrain conditions.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projets-internationaux/artificial-intelligence-and-sensor-fusion-systems-in-sustainable-robotics-for-precision-agriculture
    - name: GreenFieldData
      context: Marie Skłodowska-Curie Joint Doctorate · 2026–2031
      description: A European doctoral network coordinated by TSCF, bringing together digital methods, agroecology and the needs of technology users.
      url: https://www.inrae.fr/actualites/greenfielddata-reseau-europeen-formation-recherche-haut-niveau-innovations-numeriques-agroecologiques
    - name: agrifoodTEF
      context: European testing and experimentation network
      description: Facilities and expertise for testing and validating agricultural robotics and artificial intelligence. TSCF is involved through its experimental infrastructure.
      url: https://tscf.clermont.hub.inrae.fr/nos-projets/projets-internationaux/agrifoodtef
