<div class="{{ include.type | default: 'list' }}__item">
  <article class="archive__item">
    {% if post.header.teaser %}
    <a class="archive__item-teaser" href="{{ post.url | relative_url }}" aria-label="{{ post.title | escape }}">
      <img src="{{ post.header.teaser | relative_url }}" alt="" width="600" height="600" loading="lazy">
    </a>
    {% endif %}
    <h3 class="archive__item-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    {% if post.excerpt %}<p class="archive__item-excerpt">{{ post.excerpt | strip_html }}</p>{% endif %}
  </article>
</div>
